name: Sync Zed Releases

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      zed_tag:
        description: 'Specific zed tag to sync (e.g., v0.233.10)'
        required: false
        type: string

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      zed_tag: ${{ steps.check.outputs.zed_tag }}
      version: ${{ steps.check.outputs.version }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for new zed release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.zed_tag }}" ]; then
            echo "Using manual tag: ${{ inputs.zed_tag }}"
            TAG="${{ inputs.zed_tag }}"
          else
            TAG=$(gh release view --repo zed-industries/zed --json tagName -q '.tagName')
            echo "Latest upstream zed tag: $TAG"
          fi

          VERSION="${TAG#v}-0"
          BRANCH="release/${VERSION}"

          # Check if we already have this release branch
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Release branch $BRANCH already exists. Skipping sync."
            echo "new_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Also check if already published on crates.io
          if cargo xtask verify --tag "$TAG"; then
            echo "Release already verified on crates.io for $TAG"
            echo "new_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "New release to sync: $TAG -> $VERSION"
          echo "new_release=true" >> $GITHUB_OUTPUT
          echo "zed_tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

  extract-and-branch:
    needs: check-release
    if: needs.check-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Clone zed upstream
        run: |
          git clone --depth=1 --branch ${{ needs.check-release.outputs.zed_tag }} \
            https://github.com/zed-industries/zed.git /tmp/zed

      - name: Build xtask
        run: cargo build -p xtask --release

      - name: Transform crates
        run: |
          cargo run -p xtask --release -- transform \
            --zed-tag ${{ needs.check-release.outputs.zed_tag }} \
            --zed-path /tmp/zed

      - name: Commit to release branch
        run: |
          BRANCH="${{ needs.check-release.outputs.branch }}"
          VERSION="${{ needs.check-release.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp -r crates /tmp/crates-out
          cp -r xtask /tmp/xtask-out
          cp Cargo.toml Cargo.lock /tmp/

          git checkout --orphan "$BRANCH"
          git rm -rf . || true

          cp -r /tmp/crates-out crates
          cp -r /tmp/xtask-out xtask
          cp /tmp/Cargo.toml /tmp/Cargo.lock .

          git add .
          git commit -m "Extract Zed ${{ needs.check-release.outputs.zed_tag }} into ${BRANCH}"
          git push origin "$BRANCH"

      - name: Trigger validation workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ needs.check-release.outputs.branch }}"
          echo "Triggering validate.yml for branch $BRANCH..."
          gh workflow run validate.yml -f branch="$BRANCH"
