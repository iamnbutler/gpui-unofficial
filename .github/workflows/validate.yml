name: Validate Release Branch

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to validate'
        required: true
        type: string

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev \
            libssl-dev libfontconfig1-dev pkg-config
      - name: Test isolated package builds
        run: cargo run -p xtask --release -- test-isolated
      - name: Build GPUI examples
        run: cd crates/gpui-unofficial && cargo build --examples

  validate-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Test isolated package builds
        run: cargo run -p xtask --release -- test-isolated
      - name: Build GPUI examples
        run: cd crates/gpui-unofficial && cargo build --examples

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Test isolated package builds
        run: cargo run -p xtask --release -- test-isolated
      - name: Build GPUI examples
        run: cd crates/gpui-unofficial && cargo build --examples

  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Check Web Crate
        run: |
          cd crates/gpui-web-gpui-unofficial
          cargo -Zbuild-std=std,panic_abort check --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory,+mutable-globals"
          RUSTC_BOOTSTRAP: '1'

  on-failure:
    needs: [validate-linux, validate-macos, validate-windows, validate-web]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ inputs.branch }}' || context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Validation Failed] ${branch}`,
              body: `Matrix validation failed on branch \`${branch}\`.\n\n**Run:** ${runUrl}\n\nAutomated fix agent has been triggered to analyze logs.`,
              labels: ['validation-failure', 'automation']
            });
