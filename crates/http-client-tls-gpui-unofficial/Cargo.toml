[package]
name = "http-client-tls-gpui-unofficial"
version = "1.19.0-pre"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iamnbutler/gpui-unofficial"
description = "Unofficial release of Zed's http_client_tls crate"

[features]
test-support = []

[lib]
path = "src/http_client_tls.rs"
doctest = true

[dependencies]
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
rustls = { version = "0.23.26" }
rustls-platform-verifier = { version = "0.7" }
webpki-roots = { version = "1.0.8" }

[workspace]
