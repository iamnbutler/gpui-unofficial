[package]
name = "http-client-gpui-unofficial"
version = "1.24.1-pre"
edition = "2024"
license = "Apache-2.0"
description = "A HTTP client library for Zed and GPUI"
repository = "https://github.com/iamnbutler/gpui-unofficial"

[features]
test-support = ["dep:log"]
github-download = [
    "dep:async-compression",
    "dep:async-fs",
    "dep:sha2",
    "dep:tempfile",
    "dep:util"]

[lib]
path = "src/http_client.rs"
doctest = false

[dependencies]
anyhow = { version = "1.0.86" }
bytes = { version = "1.0" }
futures = { version = "0.3.34" }
http-body = { version = "1.0" }
http = { version = "1.1" }
log = { version = "0.4", default-features = false, features = ["std"], optional = true }
parking_lot = { version = "0.12.1" }
serde = { version = "1.0", features = ["rc", "derive"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_urlencoded = { version = "0.7" }
url = { version = "2.2" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
log = { version = "0.4", default-features = false, features = ["std"] }
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"], optional = true }
util = { package = "util-gpui-unofficial", version = "1.24.1-pre", optional = true }
async-fs = { version = "2.1", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3.20.0", optional = true }

[workspace]
