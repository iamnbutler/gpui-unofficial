[package]
name = "gpui-web-gpui-unofficial"
version = "1.15.0"
edition = "2024"
license = "Apache-2.0"
autoexamples = false
repository = "https://github.com/iamnbutler/gpui-unofficial"
description = "Unofficial release of Zed's gpui_web crate"

[features]
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread"]

[lib]
path = "src/gpui_web.rs"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui = { package = "gpui-unofficial", version = "1.15.0" }
parking_lot = { version = "0.12.1", features = ["nightly"] }
gpui_wgpu = { package = "gpui-wgpu-gpui-unofficial", version = "1.15.0" }
http_client = { package = "http-client-gpui-unofficial", version = "1.15.0" }
anyhow = { version = "1.0.86" }
futures = { version = "0.3.32" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
wasm-bindgen = { version = "0.2.120" }
wasm-bindgen-futures = { version = "0.4" }
web-time = { version = "1.1.0" }
console_error_panic_hook = { version = "0.1.7" }
js-sys = { version = "0.3" }
raw-window-handle = { version = "0.6" }
# Forked because upstream is unmaintained and its worker bootstrap still calls
# the wasm-bindgen init function with the positional arguments deprecated in 0.2.93.
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", version = "0.3", features = [
    "es_modules",
], optional = true }
web-sys = { version = "0.3", features = [
    "console",
    "Clipboard",
    "ClipboardEvent",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "IdleDeadline",
    "IdleRequestOptions",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "Screen",
    "Storage",
    "VisualViewport",
    "Headers",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "WheelEvent",
    "Window",
] }

[workspace]
