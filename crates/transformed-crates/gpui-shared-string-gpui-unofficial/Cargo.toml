[package]
name = "gpui-shared-string-gpui-unofficial"
version = "1.24.1-pre"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iamnbutler/gpui-unofficial"
description = "Unofficial release of Zed's gpui_shared_string crate"

[lib]
path = "gpui_shared_string.rs"
test = false
doctest = false

[dependencies]
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0", features = ["rc"] }
smol_str = { version = "0.3.6", default-features = false, features = ["serde"] }

[workspace]
