[package]
name = "reqwest-client-gpui-unofficial"
version = "1.24.1-pre"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iamnbutler/gpui-unofficial"
description = "Unofficial release of Zed's reqwest_client crate"

[features]
test-support = []

[lib]
path = "src/reqwest_client.rs"
doctest = false

[dependencies]
anyhow = { version = "1.0.86" }
bytes = { version = "1.0" }
futures = { version = "0.3.34" }
http_client = { package = "http-client-gpui-unofficial", version = "1.24.1-pre" }
log = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
regex = { version = "1.5", default-features = false, features = ["std", "perf"] }
reqwest = { version = "0.12.15-zed", package = "zed-reqwest", default-features = false, features = [
    "http2",
    "macos-system-configuration",
    "rustls-tls-native-roots",
    "socks",
    "stream"] }
gpui_util = { package = "gpui-util-gpui-unofficial", version = "1.24.1-pre" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
http_client_tls = { package = "http-client-tls-gpui-unofficial", version = "1.24.1-pre" }

[workspace]
