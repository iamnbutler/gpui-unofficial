[package]
name = "scheduler-gpui-unofficial"
version = "1.17.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iamnbutler/gpui-unofficial"
description = "Unofficial release of Zed's scheduler crate"

[lib]
path = "src/scheduler.rs"
doctest = false

[features]
test-support = []
# Allows `spawn_dedicated` to create real threads on wasm targets by spawning
# web workers. Off by default because it requires shared-memory threading
# (atomics + bulk-memory); wasm consumers without those build flags keep
# compiling, and `spawn_dedicated` panics at runtime instead.
#
# `flume/spin` replaces flume's internal `std::sync::Mutex` with a spinlock:
# a contended `std` lock parks with `Atomics.wait`, which the browser forbids
# on the main thread, and the main thread sends on flume channels every time
# it schedules work onto a dedicated thread.
wasm-threads = ["dep:wasm_thread", "flume/spin"]

[dependencies]
async-task = { version = "4.7" }
backtrace = { version = "0.3" }
chrono = { version = "0.4", features = ["serde"] }
flume = { version = "0.12" }
futures = { version = "0.3.32" }
parking_lot = { version = "0.12.1" }
rand = { version = "0.9" }
web-time = { version = "1.1.0" }

[target.'cfg(target_family = "wasm")'.dependencies]
# Forked because upstream is unmaintained and its worker bootstrap still calls
# the wasm-bindgen init function with the positional arguments deprecated in 0.2.93.
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", version = "0.3", features = [
    "es_modules",
], optional = true }

[workspace]
