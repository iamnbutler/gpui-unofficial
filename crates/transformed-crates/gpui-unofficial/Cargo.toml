[package]
name = "gpui-unofficial"
version = "1.18.0"
edition = "2024"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/iamnbutler/gpui-unofficial"
license = "Apache-2.0"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11", "proptest"]
bench-support = ["profiler", "dep:criterion"]
# Preserve the published feature name while consumers migrate to `bench-support`.
bench = ["bench-support"]
leak-detection = ["backtrace"]
wayland = []
x11 = [
    "scap?/x11",
]
screen-capture = [
    "scap",
]
windows-manifest = ["dep:embed-resource"]
profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]
proptest = ["dep:proptest"]

[lib]
path = "src/gpui.rs"
doctest = false
name = "gpui"

[dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
anyhow = { version = "1.0.86" }
async-task = { version = "4.7" }
backtrace = { version = "0.3", optional = true }
bitflags = { version = "2.6.0" }
collections = { package = "collections-gpui-unofficial", version = "1.18.0" }
criterion = { version = "0.5", features = ["html_reports"], optional = true }
ctor = { version = "1.0.12" }
derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from",
    "from_str",
    "mul",
    "mul_assign",
    "not"] }
etagere = { version = "0.2" }
futures = { version = "0.3.32" }
futures-concurrency = { version = "7.7.1" }
gpui_macros = { package = "gpui-macros-gpui-unofficial", version = "1.18.0" }
gpui_shared_string = { package = "gpui-shared-string-gpui-unofficial", version = "1.18.0" }
http_client = { package = "http-client-gpui-unofficial", version = "1.18.0" }
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp"] }
inventory = { version = "0.3.19" }
itertools = { version = "0.14.0" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
num_cpus = "1.13"
parking = "2.0.0"
parking_lot = { version = "0.12.1" }
postage = { version = "0.5", features = ["futures-traits"] }
chrono = { version = "0.4", features = ["serde"] }
profiling = { version = "1" }
rand = { version = "0.9" }
raw-window-handle = { version = "0.6" }
regex = { version = "1.5" }
refineable = { package = "refineable-gpui-unofficial", version = "1.18.0" }
scheduler = { package = "scheduler-gpui-unofficial", version = "1.18.0" }
resvg = { version = "0.46.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images"] }
usvg = { version = "0.46.0", default-features = false }
ttf-parser = "0.25"
util_macros = { package = "util-macros-gpui-unofficial", version = "1.18.0" }
schemars = { version = "1.0", features = ["indexmap2"] }
seahash = "4.1"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = { version = "1.0.6" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
async-channel = { version = "2.5.0" }
stacksafe = { version = "1.0", optional = true }
strum = { version = "0.27.2", features = ["derive"] }
sum_tree = { package = "sum-tree-gpui-unofficial", version = "1.18.0" }
taffy = "=0.13.0"
thiserror = { version = "2.0.12" }
tracing = { version = "0.1.40" }
gpui_util = { package = "gpui-util-gpui-unofficial", version = "1.18.0" }
hdrhistogram = { version = "7", optional = true }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.10.0"
pollster = { version = "0.4.0" }
url = { version = "2.2" }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
web-time = { version = "1.1.0" }
heapless = { version = "0.9.2" }
ztracing = { package = "ztracing-gpui-unofficial", version = "1.18.0" }
proptest = { version = "1", optional = true, features = ["attr-macro"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.1.2", features = ["js"] }


[target.'cfg(target_os = "macos")'.dependencies]
core-video = { version = "0.5.2", features = ["metal"] }
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { version = "0.0.8-zed", package = "zed-scap", default-features = false, optional = true }



[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }


[dev-dependencies]
backtrace = { version = "0.3" }
collections = { package = "collections-gpui-unofficial", version = "1.18.0", features = ["test-support"] }
env_logger = { version = "0.11" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1.18.0" }
gpui_util = { package = "gpui-util-gpui-unofficial", version = "1.18.0" }
lyon = { version = "1.0", features = ["extra"] }
rand = { version = "0.9" }
scheduler = { package = "scheduler-gpui-unofficial", version = "1.18.0", features = ["test-support"] }
unicode-segmentation = { version = "1.10" }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
http_client = { package = "http-client-gpui-unofficial", version = "1.18.0", features = ["test-support"] }
reqwest_client = { package = "reqwest-client-gpui-unofficial", version = "1.18.0", features = ["test-support"] }
proptest = { version = "1", features = ["attr-macro"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = { version = "0.2.120" }

[build-dependencies]
embed-resource = { version = "3.0", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.71"

[package.metadata.cargo-shear]
ignored = [
    "bindgen",
    "font-kit",
    "getrandom",
    "objc2",
    "objc2-metal",
    "tracing",
]
ignored-paths = ["src/_ownership_and_data_flow.rs"]

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "move_entity_between_windows"
path = "examples/move_entity_between_windows.rs"

[[example]]
name = "image"
path = "examples/image/image.rs"

